<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../public/css/main.css" />
    <link rel="stylesheet" href="../public/css/setting.css" />
    <link rel="stylesheet" href="../public/css/user.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Barcode+39&display=swap"
      rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet" />
  </head>
  <body>
      <div class="setting-dim"></div>
      <div class="setting-screen">
        <label class="setting-row">
          <span class="setting-label">OFFSET (ms)</span>
          <input class="setting-input" type="number" step="1" value="0" />
        </label>
      </div>


      <img
        class="button-start2"
        src="../public/img/Button_Start.png"
        alt="" />
      <img
        class="button-start"
        src="../public/img/Button_Start.png"
        alt="Start Button"
        onclick="location.href = 'select.html'" />
      <img
        class="button-edit2"
        src="../public/img/Button_Edit.png"
        alt="" />
      <img
        class="button-edit"
        src="../public/img/Button_Edit.png"
        alt="Edit Button"
        onclick="location.href = 'edit.html'" />
      <img
        class="button-setting2"
        src="../public/img/Button_Setting.png"
        alt="" />
      <img
        class="button-setting"
        src="../public/img/Button_Setting.png"
        alt="Setting Button" />
      <img
        class="main-logo"
        src="../public/img/Main_Logo.png"
        alt="Main Logo" />

      <div class="user-area">
        <div class="user-box">
          <div class="user-profile"></div>
          <p class="user-name">USER</p>
        </div>
        <div class="user-panel">
          <div class="user-form" data-view="login">
            <h2 class="user-title">LOGIN</h2>
            <button class="user-button" type="button" data-action="login">Login to Google</button>
          </div>

          <div class="user-form" data-view="logged-in" hidden>
            <h2 class="user-title">WELCOME</h2>
            <p class="user-welcome"></p>
            <button class="user-button" type="button" data-action="logout">LogOut</button>
          </div>
        </div>
      </div>

    <script type="module" src="user.js"></script>
    <script type="module" src="setting.js"></script>
    <script>
      document.querySelector('.main-logo').addEventListener('click', (e) => {
        e.currentTarget.classList.toggle('moved')
      })

      const settingScreen = document.querySelector('.setting-screen')
      const settingDim = document.querySelector('.setting-dim')
      const setSettingOpen = (open) => {
        settingScreen.classList.toggle('open', open)
        settingDim.classList.toggle('open', open)
      }
      document.querySelector('.button-setting').addEventListener('click', (e) => {
        e.stopPropagation()
        setSettingOpen(!settingScreen.classList.contains('open'))
      })
      document.addEventListener('click', (e) => {
        if (!settingScreen.contains(e.target)) {
          setSettingOpen(false)
        }
      })
    </script>
  </body>
</html>
