<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../public/css/edit.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <form class="upload-form" autocomplete="off">
      <h2 class="upload-title">UPLOAD</h2>
      <input class="upload-input" name="title" type="text" placeholder="TITLE" required />
      <input class="upload-input" name="artist" type="text" placeholder="ARTIST" required />
      <label class="upload-file">
        <span>AUDIO</span>
        <input name="audio" type="file" accept="audio/*" required />
      </label>
      <label class="upload-file">
        <span>IMAGE</span>
        <input name="image" type="file" accept="image/*" required />
      </label>
      <p class="upload-message"></p>
      <button class="upload-button" type="submit">Upload</button>
      <button class="upload-button" type="button" onclick="location.href = 'main.html'">Back</button>
    </form>

    <script type="module" src="edit.js"></script>
  </body>
</html>
